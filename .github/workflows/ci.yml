name: CI

# Runs on every PR and every push to main so a bad type/lint/build error is
# caught here instead of silently reaching Cloudflare Pages — see
# suggestion.md, section 2.2. Node 20 matches the project's @types/node
# range (package.json); nothing here pins a newer runtime.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Public/default values only — every one of these already has a
          # safe production fallback baked into the code (see lib/site.ts
          # and the getApiBaseUrl() helper duplicated across data-fetching
          # pages), so the build succeeds without secrets for anything that
          # only reads the public catalog. If a future page needs an
          # authenticated call (WooCommerce Consumer Key/Secret, Razorpay,
          # Resend, Supabase, Delhivery) during the *build* step specifically
          # (not just at request time), add the matching secret under repo
          # Settings → Secrets and variables → Actions using the same name
          # as in .env.example, then reference it here as
          # ${{ secrets.NAME }}.
          SITE_URL: https://artacestudio.com
          WORDPRESS_API_URL: https://api.artacestudio.com/
          WOOCOMMERCE_REST_URL: https://api.artacestudio.com/
          NEXT_PUBLIC_WOOCOMMERCE_SITE_URL: https://api.artacestudio.com/

  # Smoke tests for the revenue-critical flows (checkout, custom portraits
  # deposit, lead-capture forms) — see suggestion.md, section 2.3, and
  # e2e/mocks.ts for what's stubbed and why. Fully hermetic: no real
  # WooCommerce order, no real Razorpay contact, so this is safe to run
  # unattended on every PR. A separate job from `check` (not a step in it)
  # so its build — a real `next build && next start`, not just a type/lint
  # pass — gets its own clear pass/fail rather than being folded into a
  # differently-scoped job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: npx playwright test
        env:
          SITE_URL: https://artacestudio.com
          WORDPRESS_API_URL: https://api.artacestudio.com/
          WOOCOMMERCE_REST_URL: https://api.artacestudio.com/
          NEXT_PUBLIC_WOOCOMMERCE_SITE_URL: https://api.artacestudio.com/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
